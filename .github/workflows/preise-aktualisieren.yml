name: Preise automatisch aktualisieren

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preisaktualisierung
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Preisabruf auslösen
        env:
          SPARWACHE_URL: ${{ secrets.SPARWACHE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SPARWACHE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Repository-Secrets SPARWACHE_URL und CRON_SECRET müssen gesetzt sein."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "${SPARWACHE_URL%/}/api/pricing/refresh" \
            --header "Authorization: Bearer $CRON_SECRET"
